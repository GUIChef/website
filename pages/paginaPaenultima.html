  <body>
    <h1>Welcome to my Website!</h1>

    <p>
      This is the last one. Only the exact image file will get you through this one. <br>
      I require the loneliest crouton.
    </p>
    <form id="form">
      <label for="password">click to upload</label><br>
      <input type="file" accept=".png" id="password" name="password" placeholder="Type it in"><br>
      <input type="submit" value="Submit">
    </form>
    <a href="" id="nextLink">Click here once you have the correct password.</a>
    <script>
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const password = document.querySelector("#password").value;
        const encryptedUrlBase64 = "Ppu3nGJORcgPWAjKZGdGS/Zg5w2qhjTwwkNwvl+Pquxe7qiB+A==";
        const encryptedUrl = Uint8Array.from(
          atob(encryptedUrlBase64),
          character => character.charCodeAt(0)
        );
        const iv = new Uint8Array([71, 75, 33, 223, 226, 15, 240, 190, 103, 189, 153, 206]);
        const key = new TextEncoder().encode(password);
        const keyBytes = await crypto.subtle.digest("SHA-256", key);
        const cryptoKey = await crypto.subtle.importKey("raw", keyBytes, { name: "AES-GCM" }, false, ["decrypt"]);
        var decrypted = await crypto.subtle.decrypt({name:"AES-GCM", iv:iv}, cryptoKey, encryptedUrl);
        const url = new TextDecoder().decode(decrypted);
        document.getElementById("nextLink").href = url;
      });
    </script>
  </body>
